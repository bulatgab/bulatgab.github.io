<!doctype html>
<html lang="en">
<head>

  <meta name="color-scheme" content="light dark">

  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121214">

  <meta property="og:type" content="profile">
  <meta property="og:title" content="Bulat Gabidullin">
  <meta property="og:description" content="Frontend developer. Ex-scientist (X-ray crystallography).">
  <meta property="og:url" content="https://bulatgab.github.io/">

  <style>
    :root {
      --bg: #f6f6f4;
      --fg: #1a1a1a;
      --muted: #6b6b6b;
      --card: #ffffff;
      --border: #e2e2dd;
      --accent: #3b5bdb;
      --hover: #f1f3ff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121214;
        --fg: #ececec;
        --muted: #9a9a9a;
        --card: #1c1c20;
        --border: #2d2d33;
        --accent: #8da2fb;
        --hover: #22242f;
      }
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: var(--bg);
      color: var(--fg);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      padding: 56px 16px 40px;
    }
    main {
      width: 100%;
      max-width: 440px;
      text-align: center;
    }

    .avatar {
      display: block;
      width: 96px;
      height: 96px;
      margin: 0 auto 16px;
      border-radius: 50%;
      background: var(--border);
    }
    h1 {
      margin: 0 0 4px;
      font-size: 1.5rem;
      letter-spacing: -0.01em;
    }
    .tagline {
      margin: 0 0 32px;
      color: var(--muted);
    }

    ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 12px;
      text-align: left;
    }
    .card {
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 64px;
      padding: 12px 16px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      color: inherit;
      text-decoration: none;
      transition: border-color .15s, background .15s, transform .15s;
    }
    .card:hover {
      border-color: var(--accent);
      background: var(--hover);
      transform: translateY(-1px);
    }
    .card:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .card .icon {
      flex: none;
      width: 22px;
      height: 22px;
      fill: currentColor;
    }
    .card .text {
      flex: 1;
      min-width: 0;
    }
    .card .title {
      display: block;
      font-weight: 600;
    }
    .card .desc {
      display: block;
      font-size: 0.875rem;
      color: var(--muted);
      overflow-wrap: anywhere;
    }
    .card .arrow {
      flex: none;
      width: 16px;
      height: 16px;
      color: var(--muted);
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    @media (prefers-reduced-motion: reduce) {
      .card { transition: none; }
      .card:hover { transform: none; }
    }
  </style>
</head>
<body>
