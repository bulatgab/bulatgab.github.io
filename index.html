<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bulat Gabidullin</title>
  <meta name="description" content="Bulat Gabidullin — frontend developer: Vue.js, TypeScript, React Native. GitHub, LinkedIn, projects and email.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f6f4">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121214">
  <link rel="canonical" href="https://bulatgab.github.io/">
  <meta name="yandex-verification" content="e27e106b6cada234" />

  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <meta property="og:type" content="profile">
  <meta property="og:title" content="Bulat Gabidullin">
  <meta property="og:description" content="Frontend developer – Vue.js, TypeScript, React Native">
  <meta property="og:url" content="https://bulatgab.github.io/">
  <meta property="og:image" content="https://bulatgab.github.io/avatar.jpg">
  <meta property="og:image:width" content="320">
  <meta property="og:image:height" content="320">

  <style>
    :root {
      --bg: #f6f6f4;
      --fg: #1a1a1a;
      --muted: #6b6b6b;
      --card: #ffffff;
      --border: #e2e2dd;
      --accent: #3b5bdb;
      --hover: #f1f3ff;
      --shadow: 0 1px 2px rgba(0, 0, 0, .06), 0 8px 24px rgba(0, 0, 0, .08);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121214;
        --fg: #ececec;
        --muted: #9a9a9a;
        --card: #1c1c20;
        --border: #2d2d33;
        --accent: #8da2fb;
        --hover: #22242f;
        --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
      }
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: var(--bg);
      color: var(--fg);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      padding: 56px 16px 48px;
    }
    main {
      width: 100%;
      max-width: 480px;
    }

    /* ---- Header: photo, name, tagline, social icons ---- */
    header { text-align: center; }
    .avatar {
      display: block;
      width: 112px;
      height: 112px;
      margin: 0 auto 18px;
      border-radius: 50%;
      object-fit: cover;
      background: var(--border);
      box-shadow: var(--shadow);
    }
    h1 {
      margin: 0 0 4px;
      font-size: 1.6rem;
      letter-spacing: -0.01em;
    }
    .tagline {
      margin: 0 0 22px;
      color: var(--muted);
    }

    .socials {
      list-style: none;
      margin: 0 0 44px;
      padding: 0;
      display: flex;
      justify-content: center;
      gap: 14px;
    }
    .socials a {
      display: grid;
      place-items: center;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--card);
      border: 1px solid var(--border);
      color: inherit;
      transition: border-color .15s, background .15s, color .15s, transform .15s;
    }
    .socials a:hover {
      border-color: var(--accent);
      background: var(--hover);
      color: var(--accent);
      transform: translateY(-2px);
    }
    .socials a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }
    .socials svg {
      width: 26px;
      height: 26px;
      fill: currentColor;
    }

    /* ---- Projects ---- */
    h2 {
      margin: 0 0 12px;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .cards {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 12px;
    }
    .card {
      position: relative;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      transition: border-color .15s, background .15s, transform .15s;
    }
    .card:hover {
      border-color: var(--accent);
      background: var(--hover);
      transform: translateY(-1px);
    }
    .card .thumb {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 13px 13px 0 0; /* outer radius minus the 1px border */
      border-bottom: 1px solid var(--border);
    }
    .card .body {
      padding: 14px 18px 16px;
    }
    .card h3 {
      margin: 0 0 4px;
      font-size: 1rem;
      font-weight: 600;
    }
    /* The title link is stretched over the whole card via ::after,
       so the entire card is clickable without nesting anchors. */
    .card h3 a {
      color: inherit;
      text-decoration: none;
    }
    .card h3 a::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 14px;
    }
    .card h3 a:focus-visible { outline: none; }
    .card h3 a:focus-visible::after {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .card h3 svg {
      width: 14px;
      height: 14px;
      margin-left: 4px;
      vertical-align: -1px;
      color: var(--muted);
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .card p {
      margin: 0;
      font-size: 0.9rem;
      color: var(--muted);
    }
    .card .meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px 8px;
      margin-top: 12px;
      font-size: 0.75rem;
    }
    .card .tags {
      display: contents;
    }
    .card .tags li {
      list-style: none;
      padding: 2px 9px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--muted);
    }
    /* Secondary links sit above the stretched title link. */
    .card .source {
      position: relative;
      z-index: 1;
      margin-left: auto;
      color: var(--muted);
      text-decoration: none;
      border-bottom: 1px solid transparent;
    }
    .card .source:hover,
    .card .source:focus-visible {
      color: var(--accent);
      border-bottom-color: currentColor;
      outline: none;
    }

    @media (prefers-reduced-motion: reduce) {
      .socials a, .card { transition: none; }
      .socials a:hover, .card:hover { transform: none; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <img class="avatar" src="avatar.jpg" width="112" height="112" alt="">
      <h1>Bulat Gabidullin</h1>
      <p class="tagline">Frontend developer – Vue.js, TypeScript, React Native</p>

      <ul class="socials">
        <li>
          <a href="https://www.linkedin.com/in/bulatgab/" rel="me" aria-label="LinkedIn" title="LinkedIn">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
            </svg>
          </a>
        </li>
        <li>
          <a href="https://github.com/bulatgab" rel="me" aria-label="GitHub" title="GitHub">
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
            </svg>
          </a>
        </li>
        <li>
          <!-- Address is assembled by the script at the bottom so it never appears verbatim in the source. -->
          <a href="#" id="email" data-u="bulatgabidullin" data-d="gmail.com" aria-label="Email" title="Email">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/>
            </svg>
          </a>
        </li>
      </ul>
    </header>

    <section aria-labelledby="projects-heading">
      <h2 id="projects-heading">Projects</h2>
      <!--
        To add a project, copy one <li class="card"> block below.
        The <h3> link is the primary (whole-card) link; the <img class="thumb">
        and the "Source" link are both optional.
      -->
      <ul class="cards">
        <li class="card">
          <img class="thumb"
               src="img/lifeinweeks-480.webp"
               srcset="img/lifeinweeks-480.webp 480w, img/lifeinweeks-960.webp 960w"
               sizes="(min-width: 512px) 478px, calc(100vw - 34px)"
               width="960" height="460" loading="lazy"
               alt="A grid of coloured dots, one per week of a life: past weeks in period colours, future weeks in pink, a marker on today">
          <div class="body">
            <h3>
              <a href="https://bulatgab.github.io/lifeinweeks/">Life in Weeks<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg></a>
            </h3>
            <p>Your life as a grid of weeks — one dot per week, past dimmed, future bright. No server and no storage: every setting lives in the URL.</p>
            <div class="meta">
              <ul class="tags"><li>Vanilla JS</li><li>CSS</li><li>No backend</li></ul>
              <a class="source" href="https://github.com/bulatgab/lifeinweeks">Source</a>
            </div>
          </div>
        </li>
      </ul>
    </section>
  </main>

  <script>
    (function () {
      var a = document.getElementById('email');
      var addr = a.dataset.u + '@' + a.dataset.d;
      a.href = 'mailto:' + addr;
      a.title = addr;
    })();
  </script>
</body>
</html>
